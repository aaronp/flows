.menu { position: absolute; left: 0; top: calc(100% + 6px); z-index: 50; min-width: 210px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.14); display: flex; flex-direction: column; }
.menu [role="menuitem"] svg { width: 18px; height: 18px; flex: none; }
.menu [role="menuitem"] { white-space: nowrap; display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 10px; border: 0; background: transparent; border-radius: 7px; font-weight: 700; text-align: left; cursor: pointer; color: var(--ink); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.lbl { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.palette { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }

.list { display: flex; flex-direction: column; gap: 4px; list-style: none; margin: 0; padding: 0; }
.item { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 8px 9px; border-radius: 9px; border: 1px solid transparent; background: transparent; cursor: pointer; }
.item:hover { background: var(--code-bg); }

.item .t { font-weight: 700; font-size: 14px; }

.item .body { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 auto; }
.nb { flex: none; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--badge-ink); background: var(--nb); }

.stage { position: relative; background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 420px; display: flex; flex-direction: column; align-items: center; gap: 8px; overflow: hidden; }
.stagebar { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.orbit { width: 100%; max-width: 860px; height: auto; max-height: calc(100vh - 190px); min-height: 320px; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }

.orbit .pending, .orbit .pending-tx, .orbit .ghost, .orbit .target, .orbit .dot, .orbit .dot-halo, .orbit .alabel, .orbit .alabel-bg, .orbit .ptitle, .orbit .pslug, .orbit .centre, .orbit .centre-sub, .orbit .disc-line, .orbit .nline { pointer-events: none; }

<script>
/* Flows core — pure model operations, timeline maths and the .flow.md round-trip.
 * No DOM, no clock, no unseeded randomness: every function returns the same
 * output for the same input. The UI shell does all IO. */
'use strict';
const YAML = typeof jsyaml !== 'undefined' ? jsyaml : require('js-yaml');

/* ---------------------------------------------------------------------------
 * Data model (documented here because the page has no schema library).
 *
 * Model
 *   system  System    The system this file describes.
 *   schemas Schema[]  Message and result types defined in this file, in file order.
 *                     Steps of this system and of systems that include it can use them.
 *   flows   Flow[]    Named sequences of steps through the system, in file order.
 *
 * Schema (a message or result type)
 *   slug     string   Kebab-case id, unique in the file, e.g. "payment-requested". Steps
 *                     (message, result) and fields refer to it. Follows `title` like
 *                     participant slugs. Never a built-in type name (see BASE_TYPES).
 *   title    string   Display name, e.g. "Payment requested".
 *   summary  string   One line on what the type is for; "" when not given.
 *   fields   Field[]  In order. Field: { name, type, repeated }
 *            name     identifier, e.g. "orderId"
 *            type     a built-in type or another type's slug. Built in (BASE_TYPES):
 *                     "string"  one line of text, e.g. "ord_1042"
 *                     "text"    multi-line text, e.g. a gift note
 *                     "number"  any finite number, integer or decimal, e.g. 59.98
 *                     "boolean" true or false
 *                     "date"    an ISO 8601 date or date-time string, e.g. "2026-01-15"
 *                               or "2026-01-15T09:30:00Z"; JSON has no date, so it travels as text
 *                     "object"  any mapping whose shape this file doesn't pin down, e.g.
 *                               metadata passed through untouched; use a defined type when it does
 *            repeated true = a list of that type (written "line-item[]")

 * payment-requested titled "Payment requested", wherever they appear.
 *
 * System
 *   slug         string   Stable id, kebab-case. Follows `label` while it still
 *                         equals the slug derived from it, e.g. "storefront".
 *   label        string   Text in the centre of the ring, e.g. "Storefront".
 *   fill         string   Ring colour as #rrggbb, e.g. "#dbe4ff".
 *   opacity      number   0–1. How strongly the ring colour is painted.
 *   selfReach    number   (0,1) exclusive. How far a self-message loop travels
 *                         toward the centre, as a fraction of the ring radius.
 *   participants Participant[]  Clockwise from 12 o'clock; index = ring slot,
 *                         so reordering the array is how participants move.
 *   includes     string[] Slugs of other saved systems in this system's galaxy,
 *                         clockwise from 12 o'clock around it (index = galaxy slot).
 *                         Live references: each stays its own saved file.
 *                         Optional in the file; written only when non-empty.
 *
 * Participant
 *   slug   string  Id used by steps and (with "-" → "_") by Mermaid,
 *                  e.g. "order-service". Follows `title` like System.slug.
 *   title  string  Name drawn on the ring, e.g. "Order Service".
 *   kind   Kind    One of KIND_NAMES. Only affects icon and default colour.
 *   fill   string  Node colour as #rrggbb.
 *
 * Flow
 *   slug   string  Id used by `triggers`, e.g. "checkout". Follows `name`.
 *   name   string  Display name, e.g. "Checkout".
 *   steps  Step[]  Sorted by n.
 *
 * Step
 *   n           number       Step number, unique in the flow. Forked chains
 *                            carry on the main numbering. Order of play is
 *                            decided by `after`, not by n.
 *   from, to    Ref          Participant references. A bare slug ("order-service")
 *                            is in this system; "<system>.<slug>" ("payments.gateway-api")
 *                            is a participant of an included system. from === to is a
 *                            self-message: the participant is sender and receiver.
 *   label       string       Message label, e.g. "Place order".
 *   chain       string       "A".."Z". A = main chain; each fork gets the next letter.
 *   after       number|null  The step this one follows. null = starts the flow.
 *                            A fork is a step whose `after` is a step in another chain.
 *   message     string|null  Message type name, e.g. "PaymentRequested".
 *   tags        string[]     Free-text tags, unique, e.g. ["async", "pci"].
 *   triggers    string|null  Flow slug this step starts, e.g. "authorise-payment",
 *                            or "<system>/<flow>" for another system (phase 2).
 *   data        object       Example payload, any JSON-compatible mapping.
 *   description string       Markdown, shown in the editor and on slides.
 *   result      string|null  The receiver's reply, e.g. "PaymentResult": a request/response.
 *                            On an ordinary step it plays as a reply from `to` back to `from`
 *                            (n↩) and the steps after it wait for it. On a self-step of the
 *                            flow's entry participant (where the flow starts) it is the flow's
 *                            result: when another step triggers this flow, it goes back to that
 *                            caller, which waits for it (synchronous). One such per flow. A
 *                            triggered flow without one ends when its last step does.
 *   async       boolean      Whether the sender carries on without waiting for this step's task.
 *                            Why: a web-service call blocks its caller, a queued event does not.
 *                            false (sync, Mermaid "->>"): the steps after it wait until the
 *                            receiver's task is done — the triggered flow's last step and any
 *                            reply. true (async, Mermaid "-)"): the steps after it go on the next
 *                            beat, while the task (and any reply) plays alongside.
 *                            The sequence view draws the task as an activation box on the
 *                            receiver's lifeline, dashed when async. e.g. false.
 * ------------------------------------------------------------------------- */

// Devices (phone, laptop, tablet) are where a user's request starts or a notification lands.
const KIND_NAMES = ['user', 'phone', 'laptop', 'tablet', 'service', 'database', 'queue', 'external', 'fn', 'script', 'command', 'job', 'timer', 'system'];
const KIND_FILLS = {
  user: '#ffec99', phone: '#fcc2d7', laptop: '#dee2e6', tablet: '#99e9f2', service: '#a5d8ff', database: '#ffd8a8', queue: '#c3fae8',
  external: '#ffc9c9', fn: '#b2f2bb', script: '#fcc2d7', command: '#dee2e6', job: '#99e9f2', timer: '#eebefa', system: '#d0bfff'
};
const KIND_TITLES = {
  user: 'User', phone: 'Phone', laptop: 'Laptop', tablet: 'Tablet', service: 'Service', database: 'Database', queue: 'Queue',
  external: 'External API', fn: 'Function', script: 'Script', command: 'Command', job: 'Job', timer: 'Timer', system: 'Sub-system'
};
const SLUG_RE = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
const HEX_RE = /^#[0-9a-fA-F]{6}$/;
const CHAIN_RE = /^[A-Z]$/;
const REF_RE = /^([a-z0-9]+(?:-[a-z0-9]+)*)\.([a-z0-9]+(?:-[a-z0-9]+)*)$/;

/** "payments.gateway-api" → { system: "payments", slug: "gateway-api" }; "order-service" → { system: null, slug }. */
function parseRef(ref) {
  if (typeof ref !== 'string') throw new Error('bug: ref must be a string');
  if (!ref.includes('.')) return { system: null, slug: ref };
  const m = REF_RE.exec(ref);
  if (!m) throw new Error('bug: malformed ref "' + ref + '"');
  return { system: m[1], slug: m[2] };
}
const isExternal = (ref) => ref.includes('.');
/** Fully qualified ref, as seen from system `sys`. */
const absRef = (sys, ref) => (isExternal(ref) ? ref : sys + '.' + ref);

/** Input the person can fix (shown to them); everything else thrown is a bug. */
class UserError extends Error {}
/** A problem in a .flow.md file. `line` is 1-based. */
class FlowParseError extends Error {
  constructor(line, message) { super('Line ' + line + ': ' + message); this.line = line; this.detail = message; }
}

/* ---------- slugs ---------- */

/** First three words of `text`, kebab-case: "Order Service API v2" → "order-service-api". */
function slugify(text) {
  return String(text).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean).slice(0, 3).join('-');
}
function uniqueSlug(base, taken) {
  if (!base) throw new UserError('Give it a name with at least one letter or digit.');
  if (!taken.has(base)) return base;
  for (let i = 2; i < 10000; i++) if (!taken.has(base + '-' + i)) return base + '-' + i;
  throw new Error('bug: could not find a free slug for ' + base);
}
/** True while `slug` is still the one derived from `text` (or its -2, -3 … variant). */
function slugFollows(slug, text) {
  const base = slugify(text);
  return base !== '' && (slug === base || (slug.startsWith(base + '-') && /^\d+$/.test(slug.slice(base.length + 1))));
}

  if (!SLUG_RE.test(slug)) throw new UserError('Slugs use lower-case letters, digits and single dashes, e.g. "order-service".');
  return slug;
}

/* ---------- small pure helpers ---------- */

const isPlainObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
function findFlow(model, slug) {
  const i = model.flows.findIndex((f) => f.slug === slug);
  if (i < 0) throw new Error('bug: no flow "' + slug + '"');
  return i;
}
function findStep(flow, n) {
  const s = flow.steps.find((x) => x.n === n);
  if (!s) throw new Error('bug: flow "' + flow.slug + '" has no step ' + n);
  return s;
}
function participantIndex(model, slug) {
  const i = model.system.participants.findIndex((p) => p.slug === slug);
  if (i < 0) throw new Error('bug: no participant "' + slug + '"');
  return i;
}
const replaceAt = (arr, i, v) => arr.map((x, k) => (k === i ? v : x));

/* ---------- system & participants ---------- */

function emptyModel() {
  return {
    system: { slug: 'my-system', label: 'My system', fill: '#e9ecef', opacity: 0.6, selfReach: 0.35, participants: [], includes: [] },
    schemas: [],
    flows: [{ slug: 'main', name: 'Main', steps: [] }]
  };
}

function updateSystem(model, patch) {
  const allowed = ['label', 'slug', 'fill', 'opacity', 'selfReach'];
  Object.keys(patch).forEach((k) => { if (!allowed.includes(k)) throw new Error('bug: updateSystem got "' + k + '"'); });
  const s = model.system;
  let slug = s.slug;
  if (patch.slug !== undefined) slug = checkSlug(patch.slug);
  else if (patch.label !== undefined && slugFollows(s.slug, s.label)) slug = slugify(patch.label) || s.slug;
  if (patch.fill !== undefined && !HEX_RE.test(patch.fill)) throw new Error('bug: fill must be #rrggbb');
  if (patch.opacity !== undefined && !(patch.opacity >= 0 && patch.opacity <= 1)) throw new Error('bug: opacity out of range');
  if (patch.selfReach !== undefined && !(patch.selfReach > 0 && patch.selfReach < 1)) throw new Error('bug: selfReach out of range');
  return { ...model, system: { ...s, ...patch, slug } };
}

/** Appends a participant of `kind`. Returns { model, slug }. */
function addParticipant(model, kind, title) {
  if (!KIND_NAMES.includes(kind)) throw new Error('bug: unknown kind ' + kind);
  const parts = model.system.participants;
  const taken = new Set(parts.map((p) => p.slug));
  let t = title;
  if (t === undefined) {
    const same = parts.filter((p) => p.kind === kind).length;
    t = KIND_TITLES[kind] + (same ? ' ' + (same + 1) : '');
  }
  const slug = uniqueSlug(slugify(t), taken);
  const p = { slug, title: t, kind, fill: KIND_FILLS[kind] };

}

function renameParticipantRefs(flows, from, to) {
  if (from === to) return flows;
  return flows.map((f) => ({ ...f, steps: f.steps.map((s) => ({ ...s, from: s.from === from ? to : s.from, to: s.to === from ? to : s.to })) }));
}

/** Patch title / slug / kind / fill. Slug follows the title unless it was set by hand. Returns { model, slug }. */
function updateParticipant(model, slug, patch) {

/** Steps of `chain` in the order they play: its first step, then each step that follows the last. */
function chainSequence(flow, chain) {
  const xs = flow.steps.filter((s) => s.chain === chain);
  const inChain = new Set(xs.map((s) => s.n));
  const heads = xs.filter((s) => s.after === null || !inChain.has(s.after));
  const seq = [];
  if (heads.length === 1) {
    for (let cur = heads[0]; cur; ) {
      seq.push(cur);
      const nexts = xs.filter((s) => s.after === cur.n);
      if (nexts.length > 1) break;
      cur = nexts[0] || null;
    }
  }
  if (seq.length !== xs.length) throw new UserError('Chain ' + chain + ' isn\'t a single line of steps, so it can\'t be reordered here. Its "after" values can be edited in the Markdown.');
  return seq;
}
/**
 * Move step n to position `to` (0-based) within its chain. The chain is re-linked in the
 * new order and keeps its numbers, which follow the new positions; chains forked from a
 * step stay with that step. If that would number a step before the one it follows, the
 * flow is renumbered in play order. Returns { model, n } with the moved step's new number.
 */
function moveStep(model, flowSlug, n, to) {
  const fi = findFlow(model, flowSlug);
  const f = model.flows[fi];
  const moving = findStep(f, n);
  const seq = chainSequence(f, moving.chain);
  if (!Number.isInteger(to) || to < 0 || to >= seq.length) throw new Error('bug: move to ' + to + ' outside chain ' + moving.chain);
  const anchor = seq[0].after;
  const order = seq.filter((s) => s.n !== n);
  order.splice(to, 0, moving);
  if (order.every((s, i) => s === seq[i])) return { model, n };
  // re-link the chain, and give its numbers (in their old order) to its new order
  const nums = seq.map((s) => s.n);
  const renum = new Map(order.map((s, i) => [s.n, nums[i]]));
  const relinked = new Map(order.map((s, i) => [s.n, i === 0 ? anchor : order[i - 1].n]));
  const ren = (x) => (x === null ? null : renum.has(x) ? renum.get(x) : x);
  let steps = f.steps.map((s) => (renum.has(s.n) ? { ...s, after: ren(relinked.get(s.n)), n: renum.get(s.n) } : { ...s, after: ren(s.after) }));
  // play order: a step must come after the one it follows; renumber 1..N if needed, keeping numbers as close as possible
  const byN = new Map(steps.map((s) => [s.n, s]));
  const placed = new Map();
  let next = 1;
  while (placed.size < steps.length) {
    const ready = steps.filter((s) => !placed.has(s.n) && (s.after === null || placed.has(s.after))).sort((a, b) => a.n - b.n);
    if (!ready.length) throw new Error('bug: steps follow each other in a loop');
    placed.set(ready[0].n, next++);
  }
  steps = steps.map((s) => ({ ...s, n: placed.get(s.n), after: s.after === null ? null : placed.get(s.after) })).sort((a, b) => a.n - b.n);

  return { model: { ...model, flows: replaceAt(model.flows, fi, { ...f, steps }) }, n: placed.get(renum.get(n)) };
}

/* ---------- timeline ---------- */

/** Play slot of each step: a step plays one slot after the step it follows,
 *  so steps on different chains with equal slots run concurrently. */
function timeline(flow) {
  const slot = new Map();
  flow.steps.forEach((s) => {
    if (s.after === null) slot.set(s.n, 0);
    else {
      if (!slot.has(s.after)) throw new Error('bug: step ' + s.n + ' follows ' + s.after + ', which is not earlier');
      slot.set(s.n, slot.get(s.after) + 1);
    }
  });
  const length = flow.steps.length ? Math.max(...slot.values()) + 1 : 0;
  const order = flow.steps.slice().sort((a, b) => slot.get(a.n) - slot.get(b.n) || a.n - b.n).map((s) => s.n);
  return { slot, length, order };
}
/** For playhead t in [0, length]: each step's phase ('done' | 'active' | 'todo') and progress 0–1. */
function playPhases(flow, t) {
  const { slot } = timeline(flow);
  const s = Math.floor(t), frac = t - s;
  return new Map(flow.steps.map((st) => {
    const k = slot.get(st.n);
    return [st.n, k < s ? { phase: 'done', p: 1 } : k === s ? { phase: 'active', p: frac } : { phase: 'todo', p: 0 }];
  }));
}

/* ---------- ring geometry ---------- */

function ringLayout(count, size) {
  const c = size / 2, R = size * 0.34, nr = Math.max(14, size * 0.064);
  const pos = Array.from({ length: count }, (_, i) => {
    const th = -Math.PI / 2 + (i * 2 * Math.PI) / count;
    return { x: c + R * Math.cos(th), y: c + R * Math.sin(th), th };
  });
  return { c, R, nr, pos };
}

/**
 * Participants in one row through the ring, `spacing` apart, just below its centre (the
 * system's title sits above). Why: a folded system reads as its title over its entry points,
 * e.g. lineLayout(3, 480, 130). Labels go below, so th points down.
 */
function lineLayout(count, size, spacing) {
  const base = ringLayout(count, size), y = base.c + size * 0.1;
  const pos = Array.from({ length: count }, (_, i) => ({ x: base.c + (i - (count - 1) / 2) * spacing, y, th: Math.PI / 2 }));
  return { ...base, pos };
}
/** Self-message loop: an ellipse whose long axis runs from the participant toward the
 *  ring centre, reaching `reach` × R inward. Returns polyline points outside the node. */
function selfLoop(p, nr, R, reach) {
  if (!(reach > 0 && reach < 1)) throw new Error('bug: selfReach must be in (0, 1)');
  const ux = -Math.cos(p.th), uy = -Math.sin(p.th), px = -uy, py = ux;
  const near = nr * 0.35, far = nr + reach * R;
  const a = (far - near) / 2, b = Math.max(nr * 0.6, a * 0.55);
  const ex = p.x + ux * (near + a), ey = p.y + uy * (near + a);
  const at = (t) => ({ x: ex + ux * a * Math.cos(t) + px * b * Math.sin(t), y: ey + uy * a * Math.cos(t) + py * b * Math.sin(t) });
  const all = Array.from({ length: 73 }, (_, i) => at(-Math.PI + (i / 72) * 2 * Math.PI));
  const outside = (q, gap) => Math.hypot(q.x - p.x, q.y - p.y) > nr + gap;
  const first = all.findIndex((q) => outside(q, 4));
  let last = all.length - 1;
  while (last > first && !outside(all[last], 10)) last--;
  if (first < 0 || last - first < 6) throw new Error('bug: self loop never leaves the node');
  return { pts: all.slice(first, last + 1), apex: at(0) };
}

/* ---------- markdown: write ---------- */

/** Mermaid ids can't contain "-" or ".": "order-service" → order_service, "payments.gateway-api" → payments__gateway_api. */
const mermaidId = (ref) => { const r = parseRef(ref); return (r.system ? r.system.replace(/-/g, '_') + '__' : '') + r.slug.replace(/-/g, '_'); };
const mermaidEscape = (t) => String(t).replace(/#/g, '#35;').replace(/;/g, '#59;');
const mermaidUnescape = (t) => t.replace(/#59;/g, ';').replace(/#35;/g, '#');

function yamlBlock(obj, flowLevel) {
  return YAML.dump(obj, { lineWidth: -1, noRefs: true, flowLevel, sortKeys: false, schema: YAML.JSON_SCHEMA }).replace(/\n$/, '');
}
function fenceFor(text) {
  const runs = text.match(/`{3,}/g) || [];
  return '`'.repeat(Math.max(3, ...runs.map((r) => r.length + 1)));
}

/** Mermaid lines for a flow. Chain A runs up to the first fork; the rest become
 *  par / and branches so concurrent chains read as concurrent in any renderer. */
function mermaidFor(model, flow) {
  const out = ['sequenceDiagram'];
  model.system.participants.forEach((p) => out.push('  participant ' + mermaidId(p.slug) + ' as ' + mermaidEscape(p.title)));
  const externals = [];
  flow.steps.forEach((s) => [s.from, s.to].forEach((r) => { if (isExternal(r) && !externals.includes(r)) externals.push(r); }));
  externals.forEach((r) => out.push('  participant ' + mermaidId(r) + ' as ' + r));
  const line = (s, ind) => ind + mermaidId(s.from) + (s.async ? '-)' : '->>') + mermaidId(s.to) + ': ' + s.n + ' · ' + mermaidEscape(s.label);
  const chains = [];
  flow.steps.forEach((s) => { if (!chains.includes(s.chain)) chains.push(s.chain); });
  if (chains.length <= 1) { flow.steps.forEach((s) => out.push(line(s, '  '))); return out.join('\n'); }
  const byN = new Map(flow.steps.map((s) => [s.n, s]));
  const firstOf = (c) => flow.steps.find((s) => s.chain === c);
  const forkPoints = chains.filter((c) => c !== 'A').map((c) => firstOf(c).after).filter((a) => a !== null && byN.get(a).chain === 'A');
  const cut = forkPoints.length ? Math.min(...forkPoints) : 0;
  const head = flow.steps.filter((s) => s.chain === 'A' && s.n <= cut);
  head.forEach((s) => out.push(line(s, '  ')));
  const branches = chains.map((c) => ({ c, steps: flow.steps.filter((s) => s.chain === c && !(c === 'A' && s.n <= cut)) })).filter((b) => b.steps.length);
  const caption = (b) => 'chain ' + b.c + (b.c === 'A' || b.steps[0].after === null ? '' : ' · forked from ' + b.steps[0].after);
  if (branches.length === 1) { branches[0].steps.forEach((s) => out.push(line(s, '  '))); return out.join('\n'); }
  branches.forEach((b, k) => {
    out.push('  ' + (k === 0 ? 'par ' : 'and ') + caption(b));
    b.steps.forEach((s) => out.push(line(s, '    ')));
  });
  out.push('  end');
  return out.join('\n');
}

const F = '```';
function serialize(model) {
  const s = model.system;
  const out = ['---', 'flows: 1', '---', '', '# ' + s.label, ''];
  out.push(F + 'system', yamlBlock({
    slug: s.slug, label: s.label, fill: s.fill, opacity: s.opacity, selfReach: s.selfReach,
    ...(s.includes.length ? { includes: s.includes } : {}),
    participants: s.participants.map((p) => ({ slug: p.slug, title: p.title, kind: p.kind, fill: p.fill }))
  }, 2), F);
  if (model.schemas.length) {
    out.push('', '## Types', '', F + 'schema', yamlBlock(Object.fromEntries(model.schemas.map((x) => [x.slug, {
      title: x.title,
      ...(x.summary ? { summary: x.summary } : {}),
      fields: Object.fromEntries(x.fields.map((f) => [f.name, f.type + (f.repeated ? '[]' : '')]))
    }])), -1), F);
  }
  model.flows.forEach((f) => {
    out.push('', '## Flow: ' + f.name + ' {#' + f.slug + '}', '', F + 'mermaid', mermaidFor(model, f), F);
    f.steps.forEach((st) => {
      const block = { n: st.n, chain: st.chain, after: st.after };
      if (st.message) block.message = st.message;
      if (st.tags.length) block.tags = st.tags;
      if (st.triggers) block.triggers = st.triggers;
      if (Object.keys(st.data).length) block.data = st.data;
      if (st.result) block.result = st.result;
      out.push('', '### ' + st.n + ' · ' + (st.label || '(no label)'), '', F + 'step', yamlBlock(block, 1), F);
      if (st.description !== '') { const fence = fenceFor(st.description); out.push('', fence + 'md', st.description, fence); }
    });
  });
  return out.join('\n') + '\n';
}

/* ---------- markdown: read ---------- */

function loadYaml(text, firstLine) {
  try { return YAML.load(text, { schema: YAML.JSON_SCHEMA }); }
  catch (e) {
    const ln = e.mark && typeof e.mark.line === 'number' ? firstLine + e.mark.line : firstLine;
    throw new FlowParseError(ln, 'YAML: ' + (e.reason || e.message));
  }
}
function checkKeys(obj, required, optional, line, what) {
  if (!isPlainObject(obj)) throw new FlowParseError(line, what + ' must be a mapping of key: value lines.');
  Object.keys(obj).forEach((k) => { if (!required.includes(k) && !optional.includes(k)) throw new FlowParseError(line, what + ' has an unknown key "' + k + '". Allowed: ' + required.concat(optional).join(', ') + '.'); });
  required.forEach((k) => { if (!(k in obj)) throw new FlowParseError(line, what + ' is missing "' + k + '".'); });
}
const need = (cond, line, msg) => { if (!cond) throw new FlowParseError(line, msg); };

function readSystem(raw, line) {
  checkKeys(raw, ['slug', 'label', 'fill', 'opacity', 'selfReach', 'participants'], ['includes'], line, 'The system block');
  const includes = raw.includes ?? [];
  need(Array.isArray(includes) && includes.every((x) => typeof x === 'string' && SLUG_RE.test(x)), line, '"includes" must be a list of system slugs, e.g. [payments, fulfilment].');
  need(new Set(includes).size === includes.length, line, '"includes" lists the same system twice.');
  need(!includes.includes(raw.slug), line, 'A system cannot include itself.');
  need(typeof raw.label === 'string' && raw.label.trim() !== '', line, 'System "label" must be text.');
  need(typeof raw.slug === 'string' && SLUG_RE.test(raw.slug), line, 'System "slug" must be kebab-case, e.g. "storefront".');
  need(typeof raw.fill === 'string' && HEX_RE.test(raw.fill), line, 'System "fill" must be a colour like "#dbe4ff".');
  need(typeof raw.opacity === 'number' && raw.opacity >= 0 && raw.opacity <= 1, line, '"opacity" must be a number from 0 to 1.');
  need(typeof raw.selfReach === 'number' && raw.selfReach > 0 && raw.selfReach < 1, line, '"selfReach" must be a number between 0 and 1, e.g. 0.35.');
  need(Array.isArray(raw.participants), line, '"participants" must be a list.');
  const seen = new Set();
  const participants = raw.participants.map((p, k) => {
    const what = 'Participant ' + (k + 1);
    checkKeys(p, ['slug', 'title', 'kind', 'fill'], [], line, what);
    need(typeof p.slug === 'string' && SLUG_RE.test(p.slug), line, what + ' slug must be kebab-case, e.g. "order-service".');
    need(!seen.has(p.slug), line, 'Two participants use the slug "' + p.slug + '".');
    seen.add(p.slug);
    need(typeof p.title === 'string' && p.title.trim() !== '', line, what + ' needs a title.');
    need(KIND_NAMES.includes(p.kind), line, what + ' kind must be one of ' + KIND_NAMES.join(', ') + '.');
    need(typeof p.fill === 'string' && HEX_RE.test(p.fill), line, what + ' fill must be a colour like "#b2f2bb".');
    return { slug: p.slug, title: p.title, kind: p.kind, fill: p.fill };
  });
  return { slug: raw.slug, label: raw.label, fill: raw.fill, opacity: raw.opacity, selfReach: raw.selfReach, participants, includes };
}

function readSchemas(raw, line) {
  need(isPlainObject(raw), line, 'The schema block maps type ids to their fields, e.g. "payment-requested:".');
  const seen = new Set();
  return Object.keys(raw).map((key) => {
    const slug = typeRef(key);
    need(SLUG_RE.test(slug), line, 'Type id "' + key + '" must be kebab-case, e.g. payment-requested.');
    need(!BASE_TYPES.includes(slug), line, '"' + slug + '" is a built-in type and cannot be defined.');
    need(!seen.has(slug), line, 'Two types have the id ' + slug + '.');
    seen.add(slug);
    const v = raw[key];
    checkKeys(v, [], ['title', 'summary', 'fields'], line, 'Type ' + key);
    need(v.title === undefined || (typeof v.title === 'string' && v.title.trim() !== ''), line, 'Type ' + key + ': "title" must be text.');
    need(v.summary === undefined || typeof v.summary === 'string', line, 'Type ' + key + ': "summary" must be text.');
    const fields = v.fields ?? {};
    need(isPlainObject(fields), line, 'Type ' + key + ': "fields" maps field names to types, e.g. orderId: string.');
    return {
      slug, title: v.title ?? sentence(key), summary: v.summary ?? '',
      fields: Object.keys(fields).map((f) => {
        need(FIELD_RE.test(f), line, 'Type ' + key + ': field "' + f + '" must start with a letter and use letters, digits and _.');
        const raw2 = typeof fields[f] === 'string' ? fields[f].replace(/^([A-Za-z0-9]+)/, (n) => typeRef(n)) : null;

  });
}

function readMermaid(body, firstLine, refOf) {
  const msgs = [];
  body.split('\n').forEach((raw, k) => {
    const ln = firstLine + k;
    const t = raw.trim();
    if (t === '' || t.startsWith('%%') || t === 'sequenceDiagram' || t === 'end' || /^(par|and)(\s|$)/.test(t)) return;
    const p = /^participant\s+([A-Za-z0-9_]+)(\s+as\s+.*)?$/.exec(t);
    if (p) { need(refOf(p[1]) !== null, ln, 'Mermaid participant "' + p[1] + '" is not in the system block or an included system (ids are slugs with "-" written as "_", other systems as system__slug).'); return; }
    const m = /^([A-Za-z0-9_]+)\s*(-->>|->>|--\)|-\))\s*([A-Za-z0-9_]+)\s*:\s?(.*)$/.exec(t);
    need(m, ln, 'Unsupported Mermaid line "' + t + '". Use "from->>to: 3 · Label" (sync), "from-)to: 3 · Label" (async), "participant", or par / and / end.');
    need(refOf(m[1]) !== null, ln, '"' + m[1] + '" is not a participant here or in an included system.');
    need(refOf(m[3]) !== null, ln, '"' + m[3] + '" is not a participant here or in an included system.');

/** Parse a .flow.md document into a Model. Throws FlowParseError (with a 1-based line) on anything it can't read. */
function parse(text) {

  need(lines[0] === '---', 1, 'The file must start with front matter: "---", "flows: 1", "---".');
  const fmEnd = lines.indexOf('---', 1);
  need(fmEnd > 0, 1, 'Front matter is not closed with a "---" line.');

  checkKeys(fm, ['flows'], [], 2, 'Front matter');

        lastStep = null;

        need(system !== null, ln, 'The schema block must come after the system block.');
        need(flows.length === 0, ln, 'The schema block must come before the first flow.');

    if (!r.folded) o.push('<path class="disc-line' + (r.collapsed ? ' collapsed' : '') + (opts.selectedRing && opts.selectedRing(r.slug) ? ' ring-sel' : '') + '" d="' + rEllipse(r.cx, r.cy, R, R, rng(hash('disc' + r.slug))) + '"/>');
    if (opts.ringHits && !r.home) o.push('<circle class="ring-hit" data-ring="' + esc(r.slug) + '" cx="' + f1(r.cx) + '" cy="' + f1(r.cy) + '" r="' + f1(R + r.L.nr) + '"/>');
    const big = r.collapsed ? 1.6 : 1;
    let centre = '<text class="centre" style="font-size:' + f1(32 * k * big) + 'px" x="' + f1(r.cx) + '" y="' + f1(r.cy - 4 * k) + '" text-anchor="middle">' + esc(sys ? sys.label : r.slug) + '</text>';
    const edit = r.home && opts.editCentre;
    if (edit) centre = centre.replace('class="centre"', 'class="centre editable" data-act="edit-sys-label" role="button" tabindex="0" aria-label="Rename ' + esc(sys.label) + '"');
    o.push(!r.home && sys ? '<a class="ring-link" href="' + routeHref(r.slug, null) + '" aria-label="Open ' + esc(sys.label) + '">' + centre + '</a>' : centre);
    // Folded: a rule under the title, its entry points in a row below.
    if (r.folded) { const w = foldRuleW(r); o.push('<path class="disc-line" d="' + rLine(r.cx - w, r.cy + 10 * k, r.cx + w, r.cy + 10 * k, rng(hash('rule' + r.slug))) + '"/>'); }
    const sub = r.missing ? 'not in your saved systems' : r.collapsed ? plural(sys.participants.length, 'participant') + ' · collapsed' : r.folded ? '' : opts.sublabel ? opts.sublabel(r) : '';
    o.push('<text class="centre-sub' + (edit && opts.editSub ? ' editable" data-act="edit-flow-name" role="button" tabindex="0" aria-label="Rename flow' : '') + '" style="font-size:' + f1(Math.max(11, 12 * k * big)) + 'px" x="' + f1(r.cx) + '" y="' + f1(r.cy + 20 * k * big) + '" text-anchor="middle">' + esc(sub) + '</text>');
    if (opts.foldToggles && !r.home && sys) {
      // Expand / collapse this system: a small button on the ring's rim, top right (folded: at the end of its rule).
      const bx = r.folded ? r.cx + foldRuleW(r) + 26 : r.cx + R * Math.SQRT1_2 + 10, by = r.folded ? r.cy + 10 * k : r.cy - R * Math.SQRT1_2 - 10;
      o.push('<g class="fold-btn" data-act="fold" data-v="' + esc(r.slug) + '" role="button" tabindex="0" aria-pressed="' + !r.folded + '" aria-label="' + (r.folded ? 'Expand ' : 'Collapse ') + esc(sys.label) + '"><title>' + (r.folded ? 'Show all ' + plural(sys.participants.length, 'participant') + ' of ' : 'Show only where flows start in ') + esc(sys.label) + '</title>'
        + '<circle cx="' + f1(bx) + '" cy="' + f1(by) + '" r="20"/><path d="M' + f1(bx - 8) + ' ' + f1(by) + 'h16' + (r.folded ? 'M' + f1(bx) + ' ' + f1(by - 8) + 'v16' : '') + '"/></g>');
    }
    if (r.home && !sys.participants.length) o.push('<text class="empty-tx" x="0" y="48" text-anchor="middle">Add participants from the palette</text>');
  });
  const geo = arrowGeometry(scene, items);
  geo.forEach((g) => {
    const st = stateOf(g.it.key);
    o.push('<g data-step="' + esc(g.it.key) + '"><path class="hit" d="' + g.hit + '"/><path class="arrow ' + (st === 'normal' ? '' : st) + (g.it.ret ? ' ret' : g.it.depth ? ' sub' : '') + '" style="stroke:' + chainColor(g.it.chain) + '" d="' + g.d + '"/></g>');
  });
  if (opts.labels) {
    geo.filter((g) => opts.labels(g.it.key)).forEach((g) => {
      const text = dk(g.it) + ' · ' + (g.it.label || '(no label)');
      const w = text.length * 7.6 + 12;
      o.push('<rect class="alabel-bg" x="' + f1(g.mid.x - w / 2) + '" y="' + f1(g.mid.y - 11) + '" width="' + f1(w) + '" height="22" rx="6"/>');
      o.push('<text class="alabel" x="' + f1(g.mid.x) + '" y="' + f1(g.mid.y + 5) + '" text-anchor="middle">' + esc(text) + '</text>');
    });
  }
  const drag = opts.drag;
  if (drag) {
    const from = scene.nodes.get(drag.ref);
    o.push('<path class="ghost" d="' + rEllipse(from.x, from.y, from.nr, from.nr, rng(7)) + '"/>');
    if (drag.target) { const t = scene.nodes.get(drag.target); o.push('<path class="target" d="' + rEllipse(t.x, t.y, t.nr + 8, t.nr + 8, rng(8)) + '"/>'); }
  }
  if (ui.ringDrag && ui.ringDrag.target) {
    const t = scene.rings.find((r) => r.slug === ui.ringDrag.target);
    o.push('<path class="target" d="' + rEllipse(t.slotX, t.slotY, t.L.R + 14, t.L.R + 14, rng(8)) + '"/>');
  }
  // participants (dragged one last so it draws on top)
  const nodeList = [...scene.nodes.entries()].filter(([, n]) => !n.collapsed);
  nodeList.sort((a, b) => (drag && a[0] === drag.ref ? 1 : 0) - (drag && b[0] === drag.ref ? 1 : 0));
  nodeList.forEach(([ref, n]) => {
    const q = drag && drag.ref === ref ? { x: drag.x, y: drag.y } : n;
    const r = rng(hash('n' + ref));
    const sel = opts.selectedNode && opts.selectedNode(ref);
    const sc = (n.nr * 1.05) / 20;
    const idle = opts.shadeIdle && !n.ring.home && !n.ring.starters.has(n.p.slug);
    o.push('<g class="' + (opts.nodeHits ? '' : 'nofx') + (idle ? ' shaded' : '') + '"' + (opts.nodeHits ? ' data-node="' + esc(ref) + '" role="button" aria-label="' + esc(n.p.title) + (idle ? ', starts no flow' : '') + '"' : '') + '>');
    if (opts.nodeHits) o.push('<circle class="hitc" cx="' + f1(q.x) + '" cy="' + f1(q.y) + '" r="' + f1(n.nr + 6) + '"/>');
    o.push('<circle cx="' + f1(q.x) + '" cy="' + f1(q.y) + '" r="' + f1(n.nr) + '" style="fill:' + n.p.fill + '"/>');
    o.push('<path class="nline' + (sel ? ' sel' : '') + '" d="' + rEllipse(q.x, q.y, n.nr, n.nr, r) + (n.p.kind === 'system' ? ' ' + rEllipse(q.x, q.y, n.nr + 5, n.nr + 5, r) : '') + '"/>');
    o.push('<path class="kind-ic" vector-effect="non-scaling-stroke" transform="translate(' + f1(q.x - 10 * sc) + ' ' + f1(q.y - 10 * sc) + ') scale(' + sc.toFixed(3) + ')" d="' + ICONS[n.p.kind] + '"/>');
    o.push('</g>');
  });
  // badges at the receiving participant, fanned out away from its ring's centre
  const byNode = new Map();
  items.forEach((it) => { const n = scene.nodes.get(it.to); if (n && !n.collapsed) { if (!byNode.has(it.to)) byNode.set(it.to, []); byNode.get(it.to).push(it); } });
  byNode.forEach((list, ref) => {
    const q = scene.nodes.get(ref), dist = q.nr + 18;
    let acc = -(list.reduce((s, it) => s + 14 + dk(it).length * 7, 0) + (list.length - 1) * 5) / 2;
    list.forEach((it) => {
      const w = 14 + dk(it).length * 7;
      const a = q.th + (acc + w / 2) / dist;
      acc += w + 5;
      const x = q.x + Math.cos(a) * dist, y = q.y + Math.sin(a) * dist;
      const st = stateOf(it.key);
      const act = opts.badgeAct === 'fork' && !it.depth ? 'fork a new chain from here' : 'jump here';
      o.push('<g class="badge ' + (st === 'sel' || st === 'active' ? 'sel' : st === 'dim' ? 'dim' : '') + '" data-badge="' + esc(it.key) + '" role="button" aria-label="Step ' + esc(it.key) + ': ' + act + '" transform="translate(' + f1(x) + ' ' + f1(y) + ')">');
      o.push('<rect class="badge-bg" x="' + f1(-w / 2) + '" y="-11" width="' + w + '" height="22" rx="11" style="fill:' + chainColor(it.chain) + '"/>');
      o.push('<text class="badge-tx" x="0" y="4" text-anchor="middle">' + esc(dk(it)) + '</text></g>');
    });
  });
  // participant labels, pushed out past the badges
  nodeList.forEach(([ref, n]) => {
    const k = n.ring.size / SIZE;
    const gap = byNode.has(ref) ? n.nr + 38 : n.nr + 14;
    const x = n.x + Math.cos(n.th) * gap, y = n.y + Math.sin(n.th) * gap;
    const cs = Math.cos(n.th), sn = Math.sin(n.th);
    const anchor = cs > 0.35 ? 'start' : cs < -0.35 ? 'end' : 'middle';
    const dy = Math.abs(cs) > 0.35 ? 0 : sn < 0 ? -14 * k : 14 * k;
    const idleLabel = opts.shadeIdle && !n.ring.home && !n.ring.starters.has(n.p.slug) ? ' shaded' : '';
    o.push('<text class="ptitle' + idleLabel + '" style="font-size:19px" x="' + f1(x) + '" y="' + f1(y + dy) + '" text-anchor="' + anchor + '">' + esc(n.p.title) + '</text>');
    o.push('<text class="pslug' + idleLabel + '" x="' + f1(x) + '" y="' + f1(y + dy + 14) + '" text-anchor="' + anchor + '">' + esc(ref.startsWith(homeSlug() + '.') ? n.p.slug : ref) + '</text>');
  });
  (opts.dots || []).forEach((dt) => {
    const g = geo.find((x) => x.it.key === dt.key);
    if (!g) return; // its ends aren't on this canvas (e.g. a system outside the galaxy)
    const q = along(g.pts, dt.p);
    o.push('<circle class="dot-halo" cx="' + f1(q.x) + '" cy="' + f1(q.y) + '" r="13"/><circle class="dot" cx="' + f1(q.x) + '" cy="' + f1(q.y) + '" r="7"/>');
  });
  if (opts.pending) {
    const A = scene.nodes.get(opts.pending.from);
    if (!A) throw new Error('bug: pending from a node that is not drawn');
    if (opts.cursor) {
      const cur = opts.cursor, len = Math.hypot(cur.x - A.x, cur.y - A.y);
      if (len > A.nr + 8) o.push('<path class="pending" d="' + rLine(A.x + ((cur.x - A.x) / len) * (A.nr + 6), A.y + ((cur.y - A.y) / len) * (A.nr + 6), cur.x, cur.y, rng(3)) + '"/>');
      o.push('<text class="pending-tx" x="' + f1(cur.x + 14) + '" y="' + f1(cur.y + 26) + '">→ step ' + opts.pending.next + '</text>');
    } else o.push('<path class="target" d="' + rEllipse(A.x, A.y, A.nr + 8, A.nr + 8, rng(9)) + '"/>');
  }
  const vb = ui.cam || sceneBounds(scene);
  return '<svg class="orbit" id="orbit" viewBox="' + [vb.x, vb.y, vb.w, vb.h].map(f1).join(' ') + '" role="img" aria-label="' + (scene.rings.length > 1 ? 'System ring with included systems' : 'System ring') + '">' + o.join('') + '</svg>';
}

/* ---------- play script (memoised per model / flow / collapse) ---------- */
let scriptCache = { key: null, value: null };
function script() {
  const lib = libModels();
  const key = [model, ui.flow, ui.collapse, ...[...lib.values()]];
  if (scriptCache.key && scriptCache.key.length === key.length && scriptCache.key.every((x, i) => x === key[i])) return scriptCache.value;
  const s = C.playScript(model, lib, ui.flow, !ui.collapse);
  scriptCache = { key, value: { ...s, items: titledReturns(s.items, lib) } };
  return scriptCache.value;
}
/** Return items read as their type's title, e.g. "↩ Payment result". */
function titledReturns(items, lib) {
  const idx = C.typeIndex(model, lib);
  return items.map((it) => (it.ret ? { ...it, label: '↩ ' + C.typeTitle(idx, it.result) } : it));
}
/** This flow's own steps with their replies (n↩), sub-flows collapsed: what the editing sequence view draws. */
function flowSeqItems(f) {
  const lib = libModels();
  return titledReturns(C.playScript(model, lib, f.slug, false).items, lib);
}
const homeItems = (f) => f.steps.map((s) => ({ key: String(s.n), n: s.n, depth: 0, from: C.absRef(homeSlug(), s.from), to: C.absRef(homeSlug(), s.to), chain: s.chain, label: s.label, step: s }));

/* ---------- sequence view ---------- */
/** opts.editable: every participant of this system gets a lane, headings are clickable, opts.pendingFrom is marked. */
function seqSvg(items, stateOf, compact, opts) {
  const so = opts || {};
  const lib = libModels();
  // Participants that take part (all of this system's when editing), home ones in ring order first, then other systems' in order of appearance.
  const used = new Set(items.flatMap((it) => [it.from, it.to]));
  const lanes = model.system.participants.map((p) => homeSlug() + '.' + p.slug).filter((r) => so.editable || used.has(r));
  items.forEach((it) => [it.from, it.to].forEach((r) => { if (!lanes.includes(r)) lanes.push(r); }));
  if (!lanes.length) return '<p class="hint">Add participants first.</p>';
  const info = (ref) => {
    const { system, slug } = C.parseRef(ref);
    const m = lib.get(system);
    const p = m ? m.system.participants.find((x) => x.slug === slug) : null;
    return { title: p ? p.title : slug, fill: p ? p.fill : '#e9ecef', system: system === homeSlug() ? null : (m ? m.system.label : system) };
  };
  const colW = compact ? 132 : 170, padL = compact ? 96 : 120, rowH = compact ? 40 : 48;
  const W = padL * 2 + Math.max(0, lanes.length - 1) * colW, H = 104 + items.length * rowH + 40;
  const xs = new Map(lanes.map((r, i) => [r, padL + i * colW]));
  const o = [];
  lanes.forEach((ref) => {
    const x = xs.get(ref), r = rng(hash('l' + ref)), p = info(ref), bw = Math.min(colW - 14, 150);
    o.push('<path class="life" d="' + rLine(x, 70, x, H - 12, r) + '"/>');
    if (so.editable) o.push('<g data-node="' + esc(ref) + '" role="button" aria-label="' + esc(p.title) + '" style="cursor:pointer">');
    if (p.system) o.push('<text class="sys-tx" x="' + x + '" y="10" text-anchor="middle">' + esc(p.system) + '</text>');
    if (so.pendingFrom === ref) o.push('<rect x="' + f1(x - bw / 2 - 6) + '" y="10" width="' + (bw + 12) + '" height="60" rx="14" class="seq-pending"/>');
    o.push('<rect x="' + f1(x - bw / 2) + '" y="16" width="' + bw + '" height="48" rx="10" style="fill:' + p.fill + '"/>');
    o.push('<path class="nline" d="' + rLine(x - bw / 2, 16, x + bw / 2, 16, r) + rLine(x + bw / 2, 16, x + bw / 2, 64, r) + rLine(x + bw / 2, 64, x - bw / 2, 64, r) + rLine(x - bw / 2, 64, x - bw / 2, 16, r) + '"' + (p.system ? ' style="stroke-dasharray:6 5"' : '') + '/>');
    o.push('<text class="head-tx" x="' + x + '" y="40" text-anchor="middle">' + esc(p.title.length > 18 ? p.title.slice(0, 17) + '…' : p.title) + '</text>');
    o.push('<text class="head-slug" x="' + x + '" y="56" text-anchor="middle">' + esc(C.parseRef(ref).slug) + '</text>');
    if (so.editable) o.push('</g>');
  });
  const last = padL + (lanes.length - 1) * colW;
  o.push(activations(items, xs, (k) => 112 + k * rowH));
  items.forEach((it, k) => {
    const y = 112 + k * rowH, st = stateOf(it.key), r = rng(hash('q' + it.key + it.from + it.to));
    const stroke = st === 'dim' ? 'var(--dim)' : st === 'sel' || st === 'active' ? 'var(--accent)' : chainColor(it.chain);
    const sw = st === 'sel' || st === 'active' ? 3 : 1.7;
    const x1 = xs.get(it.from), x2 = xs.get(it.to);
    let d, lx, anchor, head;
    if (it.from === it.to) {
      const side = x1 === last ? -1 : 1, lw = 40, top = y - 12, bot = y + 10;
      d = rLine(x1 + side * 4, top, x1 + side * lw, top, r) + rLine(x1 + side * lw, top, x1 + side * lw, bot, r) + rLine(x1 + side * lw, bot, x1 + side * 3, bot, r);
      head = [[x1 + side * 14, bot - 6], [x1 + side * 3, bot], [x1 + side * 14, bot + 6]];
      lx = x1 + side * (lw + 8); anchor = side > 0 ? 'start' : 'end';
    } else {
      const dir = Math.sign(x2 - x1);
      d = rLine(x1 + dir * 4, y, x2 - dir * 3, y, r);
      head = [[x2 - dir * 13, y - 6], [x2 - dir * 2, y], [x2 - dir * 13, y + 6]];
      lx = (x1 + x2) / 2; anchor = 'middle';
    }
    const collapsedTrigger = ui.collapse && it.step.triggers ? '  ▸ ' + it.step.triggers : '';
    o.push('<g data-step="' + esc(it.key) + '" style="cursor:pointer"><path d="' + d + '" fill="none" stroke-linecap="round" style="stroke:' + stroke + ';stroke-width:' + sw + (it.ret ? ';stroke-dasharray:2 5' : it.depth ? ';stroke-dasharray:7 5' : '') + '"/>');
    // Mermaid style: a sync call ("->>") has a filled head; async ("-)") and replies an open one.
    const [h1, h2, h3] = head;
    o.push(it.async || it.ret
      ? '<path d="' + rLine(h1[0], h1[1], h2[0], h2[1], r) + rLine(h3[0], h3[1], h2[0], h2[1], r) + '" fill="none" stroke-linecap="round" style="stroke:' + stroke + ';stroke-width:' + sw + '"/>'
      : '<path d="M' + f1(h1[0]) + ' ' + f1(h1[1]) + 'L' + f1(h2[0]) + ' ' + f1(h2[1]) + 'L' + f1(h3[0]) + ' ' + f1(h3[1]) + 'Z" stroke-linejoin="round" style="fill:' + stroke + ';stroke:' + stroke + ';stroke-width:1"/>');
    o.push('<text class="lbl-tx" x="' + f1(lx) + '" y="' + f1(it.from === it.to ? y + 5 : y - 8) + '" text-anchor="' + anchor + '" style="' + (st === 'dim' ? 'fill:var(--muted)' : st === 'sel' || st === 'active' ? 'fill:var(--accent-ink);font-weight:700' : '') + '">' + esc(dk(it) + ' · ' + ((it.ret ? it.label.replace(/^↩ /, '') : it.label) || '(no label)') + collapsedTrigger) + '</text></g>');
    o.push('<text class="chain-tx" x="' + (8 + it.depth * 10) + '" y="' + f1(y + 4) + '" style="fill:' + chainColor(it.chain) + '">' + (it.depth ? '↳' : '') + it.chain + '</text>');
  });
  const size = compact ? 'style="width:max(100%, ' + Math.round(W * 0.8) + 'px);max-width:' + W + 'px;height:auto"' : 'width="' + W + '" height="' + H + '" style="max-width:none"';
  return '<div class="seqwrap"><svg class="seq" viewBox="0 0 ' + W + ' ' + H + '" ' + size + ' role="img" aria-label="Sequence diagram">' + o.join('') + '</svg></div>';
}

/**
 * Activation boxes (Mermaid's activate/deactivate): while a step's task runs — its
 * sub-flow and any reply, i.e. the items keyed under it — the receiver is busy, so a
 * box covers its lifeline from the arriving arrow to the last of those items. Nested
 * tasks on the same lifeline step right. Sync boxes are solid, async ones dashed.
 * Steps with nothing under them get no box.
 */
function activations(items, xs, rowY) {
  const row = new Map(items.map((it, k) => [it.key, k]));
  const boxes = items.filter((it) => !it.ret).map((it) => {
    const under = items.filter((x) => x.key.startsWith(it.key + '.'));
    const top = rowY(row.get(it.key));
    // A collapsed sub-flow with no reply still gets a short box: the receiver starts a task.
    if (!under.length) return it.step.triggers ? { it, lane: it.to, top, bot: top + 10 } : null;
    return { it, lane: it.to, top, bot: Math.max(...under.map((x) => rowY(row.get(x.key)))) };
  }).filter(Boolean);
  return boxes.map((b) => {
    const level = boxes.filter((o) => o !== b && o.lane === b.lane && b.it.key.startsWith(o.it.key + '.')).length;
    const x = xs.get(b.lane);
    if (x === undefined) throw new Error('bug: activation on a lane that is not drawn');
    const r = rng(hash('act' + b.it.key)), bx = x - 6 + level * 6, y0 = b.top - 2, y1 = b.bot + 8;
    return '<path class="act' + (b.it.async ? ' async' : '') + '" data-act-for="' + esc(b.it.key) + '" d="M' + f1(bx) + ' ' + f1(y0) + 'h12v' + f1(y1 - y0) + 'h-12Z"/>'
      + '<path class="act-line" d="' + rLine(bx, y0, bx + 12, y0, r) + rLine(bx + 12, y0, bx + 12, y1, r) + rLine(bx + 12, y1, bx, y1, r) + rLine(bx, y1, bx, y0, r) + '" style="stroke:' + chainColor(b.it.chain) + (b.it.async ? ';stroke-dasharray:4 4' : '') + '"/>';
  }).join('');
}

/* ---------- markdown rendering ---------- */
function md(text) {
  if (!text) return '<p class="hint">No description.</p>';
  return DOMPurify.sanitize(marked.parse(text, { mangle: false, headerIds: false }));
}

/* ---------- render: header ---------- */
function renderHeader() {
  const st = ui.store;
  const cls = st.state === 'saved' ? 'ok' : st.state === 'error' || st.state === 'paused' || st.state === 'none' ? 'bad' : '';
  const entries = [...library.entries()].sort((a, b) => labelOf(a).localeCompare(labelOf(b)));
  $('top').innerHTML =
    '<div class="menuwrap" id="file-menu-wrap"><button type="button" class="btn icon" id="file-menu-btn" data-act="file-menu" aria-label="File" title="File" aria-haspopup="menu" aria-expanded="' + ui.fileMenu + '" aria-controls="file-menu">' + icon('menu') + '</button>'
    + (ui.fileMenu ? '<div class="menu" id="file-menu" role="menu" aria-labelledby="file-menu-btn">'

/** Step numbers in the order the step list shows them: chain by chain, each in play order. */
function stepOrder(f) {
  const chains = [...new Set(f.steps.map((s) => s.chain))];
  return chains.flatMap((c) => {
    try { return C.chainSequence(f, c).map((s) => s.n); } catch (e) { if (!(e instanceof C.UserError)) throw e; return f.steps.filter((s) => s.chain === c).map((s) => s.n); }
  });
}
function stepList(f) {
  if (!f.steps.length) return '<p class="hint">No steps yet. Click a participant on the ring to start.</p>';
  const chains = [];
  f.steps.forEach((s) => { if (!chains.includes(s.chain)) chains.push(s.chain); });
  return chains.map((c) => {
    let steps;
    try { steps = C.chainSequence(f, c); } catch (e) { if (!(e instanceof C.UserError)) throw e; steps = f.steps.filter((s) => s.chain === c); }
    const fork = steps[0].after !== null && C.findStep(f, steps[0].after).chain !== c ? ' · forked from ' + steps[0].after : '';
    return '<div class="chainhead"><i style="background:' + chainColor(c) + '"></i>Chain ' + c + (c === 'A' ? ' · main' : '') + fork + '</div><ul class="list">'
      + steps.map((s) => {
        const cur = ui.sel && ui.sel.type === 'step' && ui.sel.n === s.n;
        return '<li class="steprow" draggable="true" data-drag-n="' + s.n + '" data-chain="' + c + '"><span class="grip" aria-hidden="true">⋮⋮</span><button type="button" class="item" data-act="pick-step" data-v="' + s.n + '" aria-current="' + cur + '" aria-keyshortcuts="Alt+ArrowUp Alt+ArrowDown">'
          + '<span class="nb' + (s.async ? ' async' : '') + '" style="--nb:' + (cur ? 'var(--accent)' : chainColor(s.chain)) + '"' + (s.async ? ' title="Async"' : '') + '>' + s.n + '</span><span class="body"><span class="t">' + esc(s.label || '(no label)') + '</span>'
          + '<span class="s">' + esc(s.from) + ' → ' + esc(s.to) + (s.from === s.to ? ' (self)' : '') + '</span>'
          + '<span class="row" style="gap:4px">' + (s.message ? '<span class="chip type" title="' + esc(s.message) + '">' + esc(tt(s.message)) + '</span>' : '') + s.tags.map((t) => '<span class="chip">#' + esc(t) + '</span>').join('') + (s.triggers ? '<span class="chip trig">triggers ' + esc(s.triggers) + '</span>' : '') + (s.result ? '<span class="chip ret" title="' + esc(s.result) + '">returns ' + esc(tt(s.result)) + '</span>' : '') + '</span>'
          + '</span></button></li>';
      }).join('') + '</ul>';
  }).join('');
}

/* ---------- render: markdown drawer ---------- */

/** Line numbers beside the Markdown source; the line a parse error points to is marked. */

/* ---------- render orchestration ---------- */
function render(opts) {
  const skip = (opts && opts.skip) || [];
  const focus = document.activeElement;
  const fid = focus && focus.id ? focus.id : null;
  let selStart = null, selEnd = null, scroll = 0;
  if (fid && 'selectionStart' in focus) { try { selStart = focus.selectionStart; selEnd = focus.selectionEnd; scroll = focus.scrollTop; } catch (e) { selStart = null; } }
  if (!skip.includes('header')) renderHeader();
  if (!skip.includes('left')) renderLeft();
  if (!skip.includes('right')) renderRight();
  if (!skip.includes('stage')) renderStage();
  if (!skip.includes('playbar')) renderPlaybar();
  renderDrawer();
  if (!skip.includes('modal')) renderModal();
  syncUrl();
  if (fid && document.activeElement !== document.getElementById(fid)) {
    const el = document.getElementById(fid);
    if (el) {
      el.focus({ preventScroll: true });
      if (selStart !== null && 'setSelectionRange' in el) { try { el.setSelectionRange(selStart, selEnd); el.scrollTop = scroll; } catch (e) { /* range and select inputs have no caret */ } }
    }
  }
}

/* ---------- actions ---------- */
function renameFlow(name, opts) {

  ui.flow = r.slug;

}
/** Edit an SVG label in place: an input over it, saved on Enter or blur, Escape cancels. */
function editInPlace(textEl, value, save) {
  const r = textEl.getBoundingClientRect(), w = Math.max(r.width + 48, 180);
  const inp = document.createElement('input');
  inp.className = 'field inplace';
  inp.value = value;
  inp.setAttribute('aria-label', textEl.getAttribute('aria-label') || 'Rename');
  Object.assign(inp.style, { left: (r.left + r.width / 2 - w / 2) + 'px', top: (r.top + r.height / 2) + 'px', width: w + 'px', fontSize: getComputedStyle(textEl).fontSize });
  document.body.appendChild(inp);
  inp.focus(); inp.select();
  let done = false;
  const end = (ok) => {
    if (done) return;
    done = true;
    const val = inp.value.trim();
    inp.remove();
    if (ok && val && val !== value) save(val);
  };
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); end(true); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); end(false); }
  });
  inp.addEventListener('blur', () => end(true));
}
function setMode(m) {

}
/** ref: as drawn (fully qualified). Steps store home participants as bare slugs. */
function clickNode(absRef) {

  if (!ui.pending) {
    ui.pending = { from: ref, chain: ui.chain, after: C.chainTail(f, ui.chain) };
    render({ skip: ['left'] });

  }
  const r = attempt(() => C.addStep(model, f.slug, { from: ui.pending.from, to: ref, chain: ui.pending.chain, after: ui.pending.after }));
  if (!r) return;

function forkFrom(n) {

  ui.pending = { from: s.to, chain: c, after: n };

function jumpTo(key) {
  const sc = script(), k = sc.items.findIndex((it) => it.key === key);

}

/* ---------- play clock ---------- */
let raf = 0, lastTs = 0;
function frame(ts) {

  const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
  lastTs = ts;
  const sc = script();
  const before = activeKey();
  ui.playT = Math.min(sc.length, ui.playT + (dt * ui.speed) / SLOT_SECONDS);
  if (ui.playT >= sc.length) ui.playing = false;
  const changed = activeKey() !== before || !ui.playing;

/* ---------- description formatting ---------- */
function applyFormat(kind) {
  const ta = document.getElementById('st-desc');
  if (!ta) throw new Error('bug: format without the description editor');
  const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value, sel = v.slice(a, b);
  const wrap = (l, r, ph) => { const t = sel || ph; return { text: v.slice(0, a) + l + t + r + v.slice(b), s: a + l.length, e: a + l.length + t.length }; };
  const lines = (prefix) => {
    const ls = v.lastIndexOf('\n', a - 1) + 1;
    const block = v.slice(ls, b).split('\n').map((x) => prefix + x).join('\n');
    return { text: v.slice(0, ls) + block + v.slice(b), s: ls, e: ls + block.length };
  };
  const ops = {
    b: () => wrap('**', '**', 'bold'), i: () => wrap('*', '*', 'italic'), code: () => wrap('`', '`', 'code'),
    link: () => wrap('[', '](https://)', 'link text'), h: () => lines('### '), ul: () => lines('- '), quote: () => lines('> ')
  };
  if (!ops[kind]) throw new Error('bug: unknown format ' + kind);
  const r = ops[kind]();
  commit(C.updateStep(model, flow().slug, ui.sel.n, { description: r.text }), { key: 'desc' + ui.sel.n, skip: ['right'] });
  ta.value = r.text;
  ta.focus();
  ta.setSelectionRange(r.s, r.e);
}

/* ---------- reordering steps in the list ---------- */
/** Move step n to position `to` in its chain, keep it selected (by its new number) and focused. */
function moveStepTo(n, to) {
  const f = flow();
  const r = attempt(() => C.moveStep(model, f.slug, n, to));
  if (!r || r.model === model) return;
  ui.sel = { type: 'step', n: r.n };
  ui.pending = null; ui.confirm = null; ui.drafts.data = null;
  commit(r.model);
  const btn = document.querySelector('#left [data-act="pick-step"][data-v="' + r.n + '"]');
  if (btn) btn.focus();
  toast('Moved to step ' + r.n + '.');
}
let stepDrag = null; // { n, chain }
const clearDropMarks = () => document.querySelectorAll('#left .drop-before, #left .drop-after, #left .dragging').forEach((el) => el.classList.remove('drop-before', 'drop-after', 'dragging'));
const left = $('left');
left.addEventListener('dragstart', (e) => {
  const li = e.target.closest('li[data-drag-n]');
  if (!li || ui.mode !== 'flow') return;
  stepDrag = { n: Number(li.dataset.dragN), chain: li.dataset.chain };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(stepDrag.n));
  li.classList.add('dragging');
});
left.addEventListener('dragover', (e) => {
  const li = e.target.closest('li[data-drag-n]');
  if (!stepDrag || !li || li.dataset.chain !== stepDrag.chain) return; // steps move within their own chain
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const r = li.getBoundingClientRect(), before = e.clientY < r.top + r.height / 2;
  document.querySelectorAll('#left .drop-before, #left .drop-after').forEach((el) => el.classList.remove('drop-before', 'drop-after'));
  li.classList.add(before ? 'drop-before' : 'drop-after');
});
left.addEventListener('drop', (e) => {
  const li = e.target.closest('li[data-drag-n]');
  if (!stepDrag || !li || li.dataset.chain !== stepDrag.chain) return;
  e.preventDefault();
  const before = li.classList.contains('drop-before');
  const seq = C.chainSequence(flow(), stepDrag.chain).map((s) => s.n);
  const from = seq.indexOf(stepDrag.n), over = seq.indexOf(Number(li.dataset.dragN));
  if (from < 0 || over < 0) throw new Error('bug: dragged step not in its chain');
  let to = before ? over : over + 1;
  if (from < to) to -= 1;
  const n = stepDrag.n;
  stepDrag = null;
  clearDropMarks();
  moveStepTo(n, to);
});
left.addEventListener('dragend', () => { stepDrag = null; clearDropMarks(); });

  file.text().then((text) => openText(text, file.name), () => fail('Could not read ' + file.name + '.'));
}
/** Fetch a system's Markdown (absolute, or relative to this page; another host must allow CORS). Rejects with a message to show. */
async function fetchMd(raw) {
  const url = new URL(raw, location.href);
  let res;
  try { res = await fetch(url); } catch (err) { throw new Error('Could not load ' + raw + ' (network error or blocked by CORS).'); }
  if (!res.ok) throw new Error('Could not load ' + raw + ' (HTTP ' + res.status + ').');
  return res.text();
}
function openUrl(raw) {
  const u = (raw || '').trim();
  if (!u || !ui.openDlg || ui.openDlg.busy) return;
  ui.openDlg.busy = true; ui.openDlg.error = null; ui.openDlg.url = u;
  renderModal();
  fetchMd(u).then((text) => { addRecent(new URL(u, location.href).href); openText(text, u); }, (err) => {
    if (!ui.openDlg) return;
    ui.openDlg.busy = false; ui.openDlg.error = err.message;
    renderModal();
  });
}
/** URLs opened before, newest first (this browser only). */
const RECENT_KEY = 'flows:recent';
function recentUrls() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { return []; }
}
function addRecent(u) {
  try { localStorage.setItem(RECENT_KEY, JSON.stringify([u, ...recentUrls().filter((x) => x !== u)].slice(0, 6))); } catch (e) { /* no storage: nothing to remember it in */ }
}
/** Open a system's Markdown (from a file, URL or ?src=), replacing a saved system with the same slug; only: show just this system. True if it read. */
function openText(text, name, only) {
  ui.openDlg = null;
  let m;
  try { m = C.parse(text); }
  catch (err) {
    if (!(err instanceof C.FlowParseError)) throw err;
    ui.mdOpen = true; ui.mdText = text; ui.mdError = err;
    render();
    toast(name + ' has an error: ' + err.message);
    return false;
  }
  if (only) { library.clear(); ui.isSample = false; }
  const slug = m.system.slug;
  const existing = [...library.entries()].find(([, e]) => e.model && e.model.system.slug === slug);
  const id = existing ? existing[0] : slug;
  library.set(id, { model: m, text: null, error: null, sample: false });
  persistSamples();
  markDirty(id);
  openHome(id);
  render();
  toast((existing ? 'Replaced ' : 'Opened ') + m.system.label + ' from ' + name + '.');
  return true;
}
/** ?src=<url> shows just that file, unsaved, so a shared link never overwrites the systems saved here. */
async function loadSrc() {
  const src = new URLSearchParams(location.search).get('src');
  if (!src) return;
  let text;
  try { text = await fetchMd(src); } catch (err) { toast(err.message + ' Showing your saved systems instead.'); return; }
  const saved = db;
  db = null;
  if (!openText(text, src, true)) { db = saved; return; }
  addRecent(new URL(src, location.href).href);
  setStore('none', 'Not saved: opened from a link. Download to keep changes');
}
function copyMd() {
  const text = ui.mdError ? ui.mdText : C.serialize(model);
  navigator.clipboard.writeText(text).then(() => toast('Markdown copied.'), () => {
    const ta = document.getElementById('md-text');
    if (ta) { ta.focus(); ta.select(); }
    toast('Copy is blocked here. The text is selected; press Ctrl+C or ⌘C.');
  });
}
function downloadMd() {
  if (ui.mdError) { toast('Fix the Markdown error first: ' + ui.mdError.message); return; }
  const use = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);
  use.then((dl) => {
    if (!dl) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([C.serialize(model)], { type: 'text/markdown;charset=utf-8' }));
      a.download = homeSlug() + '.flow.md';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 0); // after the download has started
      return;
    }
    dl.save({ filename: homeSlug() + '.flow.md', data: C.serialize(model) }).then(
      () => toast('Saved ' + homeSlug() + '.flow.md.'),
      (err) => { if (err && err.code !== 'declined') toast('Download failed: ' + (err.message || err.code)); }
    );
  });
}

/* ---------- storage: one document per saved system ---------- */
let db = null, saveTimer = null, loaded = false;
const dirty = new Set();
function setStore(state, msg) { ui.store = { state, msg }; renderHeader(); }
function markDirty(id) {
  if (ui.isSample) persistSamples();
  dirty.add(id);
  scheduleSave();
}
/** The first edit to the sample galaxy saves all of it, so its includes still resolve on reload. */
function persistSamples() {
  if (!ui.isSample) return;
  ui.isSample = false;
  library.forEach((e, id) => { if (e.sample) { library.set(id, { ...e, sample: false }); dirty.add(id); } });
  savePointer();
}
function scheduleSave() {
  if (!loaded || !db) return;
  if (ui.savePaused) { setStore('paused', 'Saving paused'); return; }
  clearTimeout(saveTimer);
  setStore('saving', 'Saving…');
  saveTimer = setTimeout(() => { flush().catch((err) => setStore('error', saveError(err))); }, 700);
}
const saveError = (err) => (err && err.code === 'invalid_argument' ? 'View only: changes aren\'t saved' : 'Not saved: ' + ((err && err.message) || 'unknown error'));
async function flush() {
  // A renamed home system moves to a new document; systems that include it follow the rename.
  if (model && ui.homeDoc !== homeSlug() && !ui.savePaused) {
    const oldId = ui.homeDoc, oldSlug = oldId, next = homeSlug();
    const entry = library.get(oldId);
    library.delete(oldId);
    library.set(next, entry);
    ui.homeDoc = next;
    dirty.delete(oldId);
    dirty.add(next);
    library.forEach((e, id) => {
      if (id === next || !e.model) return;
      const m = C.renameSystemRefs(e.model, oldSlug, next);
      if (m !== e.model) { library.set(id, { ...e, model: m }); dirty.add(id); }
    });
    await db.doc('systems/' + next).set({ markdown: C.serialize(model), savedAt: new Date().toISOString() });
    await db.doc('systems/' + oldId).delete();
    savePointer();
    renderHeader();
  }
  const ids = [...dirty];
  dirty.clear();
  for (const id of ids) {
    const e = library.get(id);
    if (!e || !e.model) continue;
    if (id === ui.homeDoc && ui.savePaused) continue;
    await db.doc('systems/' + id).set({ markdown: C.serialize(e.model), savedAt: new Date().toISOString() });
  }
  setStore('saved', 'Saved');
}
function savePointer() {
  if (!db || !loaded || ui.isSample) return;
  db.doc('app/state').set({ home: ui.homeDoc }).catch(() => { /* the pointer only remembers which system was open last */ });
}
/** localStorage shaped like the artifact store (the parts used here), for pages not hosted on claude.ai. Null if storage is blocked. */
function localDb() {
  let ls;
  try { ls = window.localStorage; ls.setItem('flows:probe', '1'); ls.removeItem('flows:probe'); } catch (e) { return null; }
  const key = (path) => 'flows:db:' + path;
  const doc = (path) => ({
    get: async () => { const v = ls.getItem(key(path)); return { exists: v !== null, data: () => JSON.parse(v) }; },
    set: async (data) => ls.setItem(key(path), JSON.stringify(data)),
    delete: async () => ls.removeItem(key(path))
  });
  const collection = (name) => ({
    get: async () => ({ docs: Object.keys(ls).filter((k) => k.startsWith(key(name + '/'))).map((k) => ({ id: k.slice(key(name + '/').length), data: () => JSON.parse(ls.getItem(k)) })) })
  });
  return { doc, collection };
}
async function initStore() {
  const use = window.claude && window.claude.use;
  db = use ? await use('db') : localDb();
  if (!db) { loaded = true; setStore('none', 'Not saved: storage unavailable here'); return; }
  const user = use ? await use('user') : null;
  const editable = user ? await user.canEdit() : true;
  let docs;
  try { docs = (await db.collection('systems').get()).docs.map((d) => ({ id: d.id, data: d.data() })); }
  catch (err) { loaded = true; setStore('error', 'Could not load: ' + ((err && err.message) || err.code)); return; }
  // The first version stored a single system under "current": move it under its own slug.
  const legacy = docs.find((d) => d.id === 'current');
  if (legacy && editable) {
    try {
      const m = C.parse(legacy.data.markdown);
      if (m.system.slug !== 'current') {
        if (!docs.some((d) => d.id === m.system.slug)) await db.doc('systems/' + m.system.slug).set({ markdown: legacy.data.markdown, savedAt: legacy.data.savedAt || new Date().toISOString() });
        await db.doc('systems/current').delete();
        docs = docs.filter((d) => d.id !== 'current');
        if (!docs.some((d) => d.id === m.system.slug)) docs.push({ id: m.system.slug, data: legacy.data });
      }
    } catch (err) {
      if (!(err instanceof C.FlowParseError)) throw err; // left in place; it shows as "has errors"
    }
  }
  loaded = true;
  if (!docs.length) {
    setStore(editable ? 'saved' : 'none', editable ? 'Sample · edits save automatically' : 'View only: changes aren\'t saved');
    render();
    return;
  }
  library.clear();
  docs.forEach((d) => {
    const text = d.data.markdown;
    if (typeof text !== 'string') throw new Error('bug: stored system ' + d.id + ' has no markdown');
    try {
      const m = C.parse(text);
      library.set(d.id, { model: m, text, error: null, sample: false });
      if (editable && C.serialize(m) !== text) dirty.add(d.id); // e.g. older PascalCase type names, now kebab ids
    }
    catch (err) {
      if (!(err instanceof C.FlowParseError)) throw err;
      library.set(d.id, { model: null, text, error: err, sample: false });
    }
  });
  ui.isSample = false;
  let home = null;
  try { const p = await db.doc('app/state').get(); if (p.exists && library.has(p.data().home)) home = p.data().home; }
  catch (err) { home = null; }
  openHome(home || firstId(), { keepMode: true });
  setStore(editable ? (ui.savePaused ? 'paused' : 'saved') : 'none', editable ? (ui.savePaused ? 'Saving paused' : 'Saved') : 'View only: changes aren\'t saved');
  if (editable && dirty.size) scheduleSave(); // systems converted on open are saved in the new form
  render();
}

/* ---------- boot ---------- */
const theme = new URLSearchParams(location.search).get('theme');
ui.theme = THEMES.some((x) => x.id && x.id === (OLD_THEMES[theme] || theme)) ? OLD_THEMES[theme] || theme : null;
applyTheme();
seedSamples();
render();
initStore().catch((err) => { loaded = true; setStore('error', 'Storage error: ' + (err && (err.message || err.code))); })
  .then(loadSrc)
  .then(() => applyRoute(parseRoute(location.search, location.hash)));
})();

</script>
