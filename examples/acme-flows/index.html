<!doctype html>
<meta charset="utf-8">
<title>Acme flows</title>
<script>
  // The viewer lives in its own repo; this repo only holds the data.
  // Extra query params are passed through.
  const VIEWER = 'https://aaronp.github.io/flows/';
  const src = new URL('flows.md', location.href).href;
  location.replace(VIEWER + '?src=' + encodeURIComponent(src) + location.search.replace(/^\?/, '&') + location.hash);
</script>
<a href="flows.md">flows.md</a>
